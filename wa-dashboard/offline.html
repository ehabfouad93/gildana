<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — Revenect</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#F3F4F6;color:#1F2937;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;padding:24px}
  .box{max-width:340px;text-align:center}
  .mark{color:#7C3AED;font-size:22px;letter-spacing:.16em;font-weight:900;margin-bottom:18px}
  h1{font-size:19px;margin:0 0 8px}
  p{font-size:14px;line-height:1.6;color:rgba(13,19,33,.62);margin:0 0 20px}
  button{background:#7C3AED;color:#fff;border:0;border-radius:8px;padding:11px 20px;
         font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">REVEN<span style="color:#06B6D4">E</span>CT</div>
    <h1>You're offline</h1>
    <p>This app needs a connection to load your campaigns and conversations. Check your signal and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
