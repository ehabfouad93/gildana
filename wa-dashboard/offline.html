<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — Gildana</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f6f1e7;color:#2a221a;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;padding:24px}
  .box{max-width:340px;text-align:center}
  .mark{color:#c4973a;font-size:22px;letter-spacing:.22em;font-weight:900;margin-bottom:18px}
  h1{font-size:19px;margin:0 0 8px}
  p{font-size:14px;line-height:1.6;color:rgba(42,34,26,.65);margin:0 0 20px}
  button{background:#c4973a;color:#241a08;border:0;border-radius:8px;padding:11px 20px;
         font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">GILDANA</div>
    <h1>You're offline</h1>
    <p>This app needs a connection to load your campaigns and conversations. Check your signal and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
