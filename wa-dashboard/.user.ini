; PHP settings for this app, read per-directory by PHP-FPM (and CGI/FastCGI).
;
; The default upload_max_filesize is 2M, which silently rejects an ordinary screen recording —
; a 4-minute 720p H.264 walkthrough is around 7 MB, and the intro video in Admin → Help Content
; is meant to be uploaded through the browser rather than copied onto the server by hand.
;
; post_max_size must stay ABOVE upload_max_filesize, or the whole POST is discarded before PHP
; ever sees the file, and the error you get back is an empty $_FILES rather than anything that
; explains itself.
;
; Note for whoever deploys this: the web server in front of PHP has its own limit and this file
; cannot change it. On nginx that is `client_max_body_size` (default 1m — smaller than PHP's
; own default, so it will bite first). On Apache it is LimitRequestBody. If an upload fails
; with no PHP error at all, that front-end limit is where to look.
;
; PHP-FPM caches .user.ini for user_ini.cache_ttl seconds (300 by default), so a change here
; can take five minutes to take effect. Restarting the container applies it immediately.

upload_max_filesize = 128M
post_max_size = 132M

; Uploading a large file over a slow connection should not be killed by the request timeout.
max_input_time = 300
